[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-semantic-planner"
version = "0.1.9"
description = "Rule-based mission planner and semantic error-recovery system that decomposes high-level goals into robotic primitives (a local LLM on Hailo-10 is planned)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["hydra-umc", "hailo-10", "llm", "planner", "robotics", "edge-ai"]

# The vocabulary of the MCU errors comes from the SDK at run time (pinned to its published tag, installed from the archive of the tag so no git is needed).
dependencies = ["hydra-umc-sdk @ https://github.com/JuanenRac/HYDRA-UMC-SDK/archive/refs/tags/v0.5.2.tar.gz#subdirectory=clients/python"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/JuanenRac/HYDRA-UMC-SEMANTIC-PLANNER"

[project.scripts]
hydra-umc-semantic-planner = "hydra_umc_semantic_planner.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.mypy]
ignore_missing_imports = true
